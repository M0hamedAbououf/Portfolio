<!doctype html>
<!--
  PROTOTYPE (throwaway): title font to pair with Lato (body), wording = text 1, plus the moving services banner.
  ?title=1..4  ?lang=en|ar
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title font options with Lato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Tajawal:wght@400;500;700&family=Montserrat:wght@600;700&family=Cairo:wght@700;800&family=Merriweather:wght@700;900&family=Noto+Naskh+Arabic:wght@600;700&family=Prata&family=Amiri:wght@700&family=Bebas+Neue&family=Lalezar&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f0eb;--surface:#ede5dc;--ink:#14110e;--muted:#5a5550;--accent:#8a654b;--line:#d9cbbd}
body{background:var(--bg);color:var(--ink);font-family:Lato,sans-serif;-webkit-font-smoothing:antialiased}
:root[lang=ar] body{font-family:Tajawal,sans-serif}
.wrap{width:min(1240px,100%);margin:0 auto;padding:0 40px}
nav{display:flex;justify-content:space-between;align-items:center;height:76px}
.brand{font-family:var(--title);letter-spacing:.14em;font-size:18px;font-weight:var(--tw)}
.tools{display:flex;gap:8px}
.tools button{height:40px;padding:0 14px;border:1px solid var(--line);background:none;font:700 14px Lato;cursor:pointer;color:var(--ink)}
.tools button.on{border-color:var(--accent);color:#fff;background:var(--accent)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;min-height:calc(100vh - 76px - 64px)}
.role{color:var(--accent);font-size:15px;font-weight:700}
h1{margin:18px 0 24px;text-wrap:balance;font-family:var(--title);font-weight:var(--tw);font-size:var(--ts);line-height:var(--tl);letter-spacing:var(--tk);text-transform:var(--tt)}
.lead{color:var(--muted);font-size:19px;line-height:1.7;max-width:54ch}
:root[lang=ar] .lead{font-size:20px}
.cta{display:flex;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;border:1px solid var(--accent);font-weight:700;font-size:15px}
.btn.p{background:var(--accent);color:#fff}
.status{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:14px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:#3f9d6a;box-shadow:0 0 0 4px rgba(63,157,106,.2)}
.proof{display:flex;gap:44px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
.proof b{display:block;font-family:var(--title);font-weight:var(--tw);font-size:32px;line-height:1.2;color:var(--accent)}
.proof span{font-size:13px;color:var(--muted)}
.figure{position:relative;height:min(700px,78vh)}
.figure::before{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,rgba(138,101,75,.22),transparent)}
.figure img{position:absolute;bottom:0;left:50%;translate:-50% 0;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 80%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 80%,transparent 100%);mask-composite:intersect}

/* moving services banner, as on the old portfolio */
.ticker{border-block:1px solid var(--line);background:var(--surface);overflow:hidden;height:64px;display:flex;align-items:center;direction:ltr}
.ticker-track{display:flex;flex:none;animation:slide 32s linear infinite}
:root[lang=ar] .ticker-track{animation-direction:reverse}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{display:inline-flex;align-items:center;gap:28px;padding-inline-end:28px;white-space:nowrap;font-family:var(--title);font-weight:var(--tw);font-size:22px;letter-spacing:var(--tk2);text-transform:var(--tt)}
.ticker-track span::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

/* title options; body stays Lato / Tajawal */
.t1{--title:Montserrat;--tw:700;--ts:clamp(40px,4.7vw,66px);--tl:1.08;--tk:-.02em;--tk2:.01em;--tt:none}
.t2{--title:Merriweather;--tw:900;--ts:clamp(38px,4.5vw,62px);--tl:1.15;--tk:-.01em;--tk2:0;--tt:none}
.t3{--title:Prata;--tw:400;--ts:clamp(42px,5vw,70px);--tl:1.1;--tk:-.005em;--tk2:.02em;--tt:none}
.t4{--title:"Bebas Neue";--tw:400;--ts:clamp(54px,6.6vw,96px);--tl:.95;--tk:.01em;--tk2:.06em;--tt:uppercase}
:root[lang=ar] .t1{--title:Cairo;--tw:800;--ts:clamp(36px,4.3vw,58px);--tl:1.35;--tk:0;--tk2:0}
:root[lang=ar] .t2{--title:"Noto Naskh Arabic";--tw:700;--ts:clamp(38px,4.5vw,60px);--tl:1.45;--tk:0;--tk2:0}
:root[lang=ar] .t3{--title:Amiri;--tw:700;--ts:clamp(42px,5vw,68px);--tl:1.4;--tk:0;--tk2:0}
:root[lang=ar] .t4{--title:Lalezar;--tw:400;--ts:clamp(42px,5vw,70px);--tl:1.3;--tk:0;--tk2:0;--tt:none}

#bar{position:fixed;left:50%;bottom:18px;translate:-50% 0;z-index:9;display:flex;align-items:center;gap:6px;background:#202020;color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font:600 14px system-ui;direction:ltr;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#bar span{opacity:.6;font-weight:400;margin-right:4px}
#bar button{height:34px;padding:0 14px;border-radius:999px;border:0;background:#3a3a3a;color:#fff;cursor:pointer;font:600 13px system-ui}
#bar button.on{background:#fff;color:#202020}
@media (max-width:860px){.hero{grid-template-columns:1fr}.figure{height:400px;order:-1}#bar{flex-wrap:wrap;justify-content:center;border-radius:20px;width:calc(100% - 24px)}}
</style>
</head>
<body>
<div class="wrap">
  <nav><div class="brand">ABOUOUF</div><div class="tools"><button data-lang="en">EN</button><button data-lang="ar">عربي</button></div></nav>
  <section class="hero">
    <div>
      <p class="role" data-t="role"></p>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="cta"><span class="btn p" data-t="ig"></span><span class="btn" data-t="li"></span></div>
      <p class="status"><i></i><span data-t="av"></span></p>
      <div class="proof">
        <div><b dir="ltr">20+</b><span data-t="l1"></span></div>
        <div><b>5</b><span data-t="l2"></span></div>
        <div><b dir="ltr" data-t="n3"></b><span data-t="l3"></span></div>
      </div>
    </div>
    <div class="figure"><img src="shots/portrait-cut.png" alt=""></div>
  </section>
</div>
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="track"></div></div>
<div id="bar"><span>Title font</span>
  <button data-title="1">Montserrat</button><button data-title="2">Merriweather</button><button data-title="3">Prata</button><button data-title="4">Bebas Neue</button>
</div>
<script>
const T = {
  en:{role:"Mohamed Abououf, communications engineer",title:"Hi, I'm Mohamed. I build digital products that work.",
      lead:"Websites, online stores, booking systems and CRMs, designed and engineered from start to finish, in Arabic and English. Based in Port Said, working with clients everywhere.",
      ig:"Message me on Instagram",li:"LinkedIn",av:"Available for new projects",l1:"projects delivered",l2:"services",n3:"EN / ع",l3:"every project bilingual",
      services:["Website development","System design","Automation","UI/UX design","Shopify development"]},
  ar:{role:"محمد أبو عوف، مهندس اتصالات",title:"أهلاً، أنا محمد. أبني منتجات رقمية تعمل فعلاً.",
      lead:"مواقع ومتاجر إلكترونية وأنظمة حجز وCRM، أصممها وأبنيها من البداية للنهاية بالعربية والإنجليزية. من بورسعيد، وأعمل مع عملاء في كل مكان.",
      ig:"راسلني على إنستجرام",li:"لينكدإن",av:"متاح لمشاريع جديدة",l1:"مشروعاً منجزاً",l2:"خدمات",n3:"ع / EN",l3:"كل مشروع بلغتين",
      services:["تطوير المواقع","تصميم الأنظمة","الأتمتة","تصميم واجهات المستخدم","تطوير متاجر Shopify"]},
};
const q = new URLSearchParams(location.search);
let title = Math.min(4, Math.max(1, +q.get("title") || 1)), lang = q.get("lang")==="ar" ? "ar" : "en";
function render(){
  const root = document.documentElement;
  root.lang = lang; root.dir = lang==="ar" ? "rtl" : "ltr"; root.className = "t"+title;
  const t = T[lang];
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  const run = t.services.map(s => `<span>${s}</span>`).join("");
  document.getElementById("track").innerHTML = run + run + run + run; // two identical halves loop seamlessly
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang===lang));
  document.querySelectorAll("[data-title]").forEach(b => b.classList.toggle("on", +b.dataset.title===title));
  history.replaceState(null, "", "?"+new URLSearchParams({title, lang}));
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
document.querySelectorAll("[data-title]").forEach(b => b.onclick = () => { title = +b.dataset.title; render(); });
addEventListener("keydown", e => { if (e.key==="ArrowRight") { title = title%4+1; render(); } if (e.key==="ArrowLeft") { title = (title+2)%4+1; render(); } });
render();
</script>
</body>
</html>
